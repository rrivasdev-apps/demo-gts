<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Trade Solutions — Venezuelan Coffee &amp; Cocoa</title>

<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:'Public Sans';src:url(fonts/public-sans.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/plex-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
</style>
<style>
body{margin:0;background:#FFFFFF;color:#14202E;font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0F2747}a:hover{color:#B37A12}
html{scroll-behavior:smooth}
input,select,textarea{font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #F2B544;outline-offset:1px}
.nav-links{display:flex}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.model{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr) 72px minmax(0,1fr)}
.arrow-h{display:flex}
@media (max-width: 900px){
.nav-links{display:none}
.two{grid-template-columns:minmax(0,1fr)}
.model{grid-template-columns:minmax(0,1fr)}
.arrow-h{display:none}
}
.lift{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s cubic-bezier(.2,.7,.2,1);box-shadow:0 1px 2px rgba(10,27,51,.06),0 10px 28px -10px rgba(10,27,51,.22),0 28px 56px -28px rgba(10,27,51,.28)}
.lift:hover{transform:translateY(-8px);box-shadow:0 2px 4px rgba(10,27,51,.06),0 22px 44px -12px rgba(10,27,51,.30),0 48px 80px -36px rgba(10,27,51,.40)}
.lift-dark{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s;box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.lift-dark:hover{transform:translateY(-8px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(242,181,68,.45)}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:kb 21s linear infinite;will-change:transform,opacity}
.s2{animation-delay:7s}.s3{animation-delay:14s}
@keyframes kb{0%{opacity:0;transform:scale(1.02) translate3d(0,0,0)}5%{opacity:1}33%{opacity:1}40%{opacity:0;transform:scale(1.16) translate3d(-2%,-1%,0)}100%{opacity:0;transform:scale(1.16) translate3d(-2%,-1%,0)}}
.bar{display:block;height:100%;width:0;background:#F2B544;animation:fill 21s linear infinite}
.b2{animation-delay:7s}.b3{animation-delay:14s}
@keyframes fill{0%{width:0}33.3%{width:100%}33.4%{width:0}100%{width:0}}
.rise{opacity:0;transform:translateY(28px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:1s}
@keyframes rise{to{opacity:1;transform:none}}
.swap{animation:swap .5s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ticker{display:flex;width:max-content;animation:tick 38s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
.cue{animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.flip{perspective:1600px;height:460px;outline:none;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.flip:hover,.flip:focus-within,.flip:focus{transform:translateY(-8px)}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.75,.15,1);transform-style:preserve-3d}
.flip:hover .flip-inner,.flip:focus .flip-inner,.flip:focus-within .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(10,27,51,.06),0 14px 34px -12px rgba(10,27,51,.28),0 36px 70px -34px rgba(10,27,51,.35)}
.back{transform:rotateY(180deg)}
.flip.short{height:300px}
.zoom-wrap{overflow:hidden}
.zoom{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.zoom-wrap:hover .zoom{transform:scale(1.07)}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,181,68,.55)}100%{box-shadow:0 0 0 18px rgba(242,181,68,0)}}
.step{transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s,box-shadow .4s}
.step:hover{transform:translateY(-8px);background:#0F2747;box-shadow:0 26px 50px -22px rgba(10,27,51,.5)}
.step:hover .sn{color:#F2B544}
.step:hover .st{color:#FFFFFF}
.step:hover .sd{color:#C9D4E3}
.cta{transition:transform .3s,box-shadow .3s,background .3s}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(242,181,68,.6)}
.grow{transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lang-btn{transition:background .25s,color .25s}
@supports (animation-timeline: view()){
.reveal{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
@keyframes rv{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
.grow{animation:grow linear both;animation-timeline:view();animation-range:entry 10% cover 35%}
}
@media (prefers-reduced-motion: reduce){
.slide,.bar,.rise,.float,.ticker,.cue,.flow,.pulse,.grow,.reveal,.swap{animation:none !important;opacity:1 !important;transform:none !important}
.slide.s2,.slide.s3{opacity:0 !important}
.flip-inner{transition:none}
}
</style>

<style>section{scroll-margin-top:76px}@media (max-width:600px){header .cta{display:none}}</style>

<body>
<div id="app"></div>
<template id="page-template">

<div style="width: 100%; overflow-x: clip">

<!-- NAV -->
<header style="position: sticky; top: 0; z-index: 20; background: rgba(10,27,51,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #FFFFFF; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="max-width: 1320px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<a href="#top" style="display: flex; align-items: center; gap: 14px; color: #FFFFFF; text-decoration: none">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="9" fill="none" stroke="#F2B544" stroke-width="2"></rect><path d="M8 26 L20 12 L32 26" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"></path><path d="M8 31 H32" stroke="#F2B544" stroke-width="2.4"></path></svg>
<span style="display: flex; flex-direction: column; line-height: 1">
<span style="font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 17px; letter-spacing: 0.06em">GLOBAL TRADE</span>
<span style="font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 500; font-size: 11px; letter-spacing: 0.34em; color: #F2B544; margin-top: 4px">SOLUTIONS</span>
</span>
</a>
<nav class="nav-links" aria-label="Main" style="gap: 32px; align-items: center; font-size: 14px; font-weight: 500">
<a href="#coffee" style="color: #D6DEEA; text-decoration: none">{{ t.navCoffee }}</a>
<a href="#quality" style="color: #D6DEEA; text-decoration: none">{{ t.navQuality }}</a>
<a href="#cocoa" style="color: #D6DEEA; text-decoration: none">{{ t.navCocoa }}</a>
<a href="#process" style="color: #D6DEEA; text-decoration: none">{{ t.navProcess }}</a>
<a href="#about" style="color: #D6DEEA; text-decoration: none">{{ t.navAbout }}</a>
</nav>
<div style="display: flex; align-items: center; gap: 14px">
<div role="group" aria-label="Language" style="display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18)">
<button class="lang-btn" type="button" onClick="{{ setEn }}" aria-pressed="{{ enOn }}" style="{{ enStyle }}">EN</button>
<button class="lang-btn" type="button" onClick="{{ setEs }}" aria-pressed="{{ esOn }}" style="{{ esStyle }}">ES</button>
</div>
<a class="cta" href="#sample" style="background: #F2B544; color: #0A1B33; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: 999px; min-height: 44px; display: inline-flex; align-items: center">{{ t.ctaSample }}</a>
</div>
</div>
</header>

<sc-for list="{{ page }}" as="pg" hint-placeholder-count="1">
<div class="swap">

<!-- HERO -->
<section id="top" style="position: relative; min-height: 800px; background: #0A1B33; color: #FFFFFF; overflow: hidden; display: flex; flex-direction: column">
<img class="slide" src="img/hero-mountains.jpg" alt="{{ t.altHero1 }}">
<img class="slide s2" src="img/picking.jpg" alt="{{ t.altHero2 }}">
<img class="slide s3" src="img/cherries-hands.jpg" alt="{{ t.altHero3 }}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,27,51,0.94) 0%, rgba(10,27,51,0.78) 38%, rgba(10,27,51,0.25) 72%, rgba(10,27,51,0.15) 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(0deg, rgba(10,27,51,0.95), rgba(10,27,51,0))"></div>
<div style="position: relative; flex: 1; width: 100%; max-width: 1320px; margin: 0 auto; padding: 120px 32px 80px; display: flex; align-items: center; justify-content: space-between; gap: 48px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 30px; max-width: 760px">
<div class="rise d1" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #F2B544; background: rgba(242,181,68,0.1); border: 1px solid rgba(242,181,68,0.35); padding: 9px 16px; border-radius: 999px">
<span class="pulse" style="width: 8px; height: 8px; border-radius: 50%; background: #F2B544; display: inline-block"></span>
<span>{{ t.badge }}</span>
</div>
<h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 86%; font-weight: 800; font-size: clamp(46px, 6.6vw, 96px); line-height: 0.94; letter-spacing: -0.025em">
<span class="rise d2" style="display: block">{{ t.h1a }}</span>
<span class="rise d3" style="display: block; color: #F2B544">{{ t.h1b }}</span>
</h1>
<p class="rise d4" style="margin: 0; max-width: 580px; font-size: 19px; line-height: 1.6; color: #D3DCE8">{{ t.heroP }}</p>
<div class="rise d5" style="display: flex; gap: 14px; flex-wrap: wrap">
<a class="cta" href="#sample" style="background: #F2B544; color: #0A1B33; text-decoration: none; font-weight: 700; font-size: 16px; padding: 17px 28px; border-radius: 999px; min-height: 52px; display: inline-flex; align-items: center; gap: 10px">{{ t.ctaSample }} <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8 H13 M9 4 L13 8 L9 12" fill="none" stroke="#0A1B33" stroke-width="2"></path></svg></a>
<a href="#coffee" style="background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.28); color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; padding: 17px 28px; border-radius: 999px; min-height: 52px; display: inline-flex; align-items: center">{{ t.ctaExplore }}</a>
</div>
</div>
<div class="rise d5" style="flex: 0 1 320px">
<div class="float" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.22); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #F2B544">{{ t.refLot }}</span>
<span style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.9">82.25<span style="font-size: 16px; font-weight: 600; color: #C9D4E3; margin-left: 8px">{{ t.pts }}</span></span>
<span style="font-size: 15px; color: #E4EAF2">{{ t.notesShort }}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.18)">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B4C2D6">{{ t.altitude }}</span><span style="font-weight: 700">1,600–1,850 m</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B4C2D6">{{ t.screen16 }}</span><span style="font-weight: 700">88%</span></span>

<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #B4C2D6">{{ t.defCups }}</span><span style="font-weight: 700">0</span></span>
</div>
</div>
</div>
</div>
<div style="position: relative; width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 32px 28px; display: flex; justify-content: space-between; align-items: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #B4C2D6">
<span style="width: 26px; height: 40px; border: 1.5px solid rgba(255,255,255,0.5); border-radius: 14px; display: inline-flex; justify-content: center; padding-top: 7px"><span class="cue" style="width: 4px; height: 8px; border-radius: 2px; background: #F2B544; display: block"></span></span>
<span>{{ t.scroll }}</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 8px; align-items: center">
<span style="width: 54px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; display: block"><span class="bar"></span></span>
<span style="width: 54px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; display: block"><span class="bar b2"></span></span>
<span style="width: 54px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; display: block"><span class="bar b3"></span></span>
</div>
</div>
<div aria-hidden="true" style="position: relative; border-top: 1px solid rgba(255,255,255,0.12); background: rgba(10,27,51,0.6); overflow: hidden; padding: 16px 0">
<div class="ticker" style="font-family: 'Archivo', sans-serif; font-stretch: 110%; font-weight: 600; font-size: 15px; letter-spacing: 0.16em; color: #C9D4E3; white-space: nowrap">
<sc-for list="{{ tickerTwice }}" as="tk" hint-placeholder-count="2">

<sc-for list="{{ tk.items }}" as="w" hint-placeholder-count="9"><span>{{ w }} <span style="color: #F2B544">✦</span></span></sc-for>
</span>
</sc-for>
</div>
</div>
</section>

<!-- ABOUT / MODEL -->
<section id="about" style="background: #FFFFFF">
<div style="max-width: 1320px; margin: 0 auto; padding: 128px 32px 120px; display: flex; flex-direction: column; gap: 64px">
<div class="two reveal" style="gap: 64px; align-items: end">
<div style="display: flex; flex-direction: column; gap: 20px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #8A5A00">{{ t.whoEy }}</span>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 88%; font-weight: 800; font-size: clamp(38px, 4.4vw, 62px); line-height: 1; letter-spacing: -0.02em; color: #0F2747">{{ t.whoH }}</h2>
</div>
<p style="margin: 0; font-size: 18px; line-height: 1.7; color: #3B4A5C">{{ t.whoP }}</p>
</div>
<div class="model reveal" style="align-items: stretch">
<div class="lift" style="background: #FFFFFF; border: 1px solid #E3E9F1; padding: 34px; border-radius: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #EEF2F7; display: inline-flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 23 C13 15 7 13 4 12 C6 6 12 5 13 11 C14 5 20 6 22 12 C19 13 13 15 13 23 Z" fill="none" stroke="#0F2747" stroke-width="1.8" stroke-linejoin="round"></path></svg></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A6B80">{{ t.m1k }}</span>
<span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 23px; color: #0F2747">{{ t.m1t }}</span>
<span style="font-size: 15px; line-height: 1.6; color: #3B4A5C">{{ t.m1d }}</span>
</div>
<div class="arrow-h" style="align-items: center; justify-content: center"><svg width="64" height="16" viewBox="0 0 64 16" aria-hidden="true"><path class="flow" d="M2 8 H54" fill="none" stroke="#B37A12" stroke-width="2.2"></path><path d="M50 3 L58 8 L50 13" fill="none" stroke="#B37A12" stroke-width="2.2"></path></svg></div>
<div class="lift" style="background: #0F2747; color: #FFFFFF; padding: 34px; border-radius: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #F2B544; display: inline-flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="4" fill="none" stroke="#0A1B33" stroke-width="2"></circle><path d="M13 2 V7 M13 19 V24 M2 13 H7 M19 13 H24" stroke="#0A1B33" stroke-width="2"></path></svg></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #F2B544">02 · GLOBAL TRADE SOLUTIONS</span>
<span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 23px">{{ t.m2t }}</span>
<span style="font-size: 15px; line-height: 1.6; color: #C9D4E3">{{ t.m2d }}</span>
</div>
<div class="arrow-h" style="align-items: center; justify-content: center"><svg width="64" height="16" viewBox="0 0 64 16" aria-hidden="true"><path class="flow" d="M2 8 H54" fill="none" stroke="#B37A12" stroke-width="2.2"></path><path d="M50 3 L58 8 L50 13" fill="none" stroke="#B37A12" stroke-width="2.2"></path></svg></div>
<div class="lift" style="background: #FFFFFF; border: 1px solid #E3E9F1; padding: 34px; border-radius: 22px; display: flex; flex-direction: column; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: #EEF2F7; display: inline-flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#0F2747" stroke-width="1.8"></circle><path d="M3 13 H23 M13 3 C9 8 9 18 13 23 M13 3 C17 8 17 18 13 23" fill="none" stroke="#0F2747" stroke-width="1.6"></path></svg></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A6B80">{{ t.m3k }}</span>

<span style="font-size: 15px; line-height: 1.6; color: #3B4A5C">{{ t.m3d }}</span>
</div>

<!-- COFFEE PROGRAMS -->
<section id="coffee" style="background: #F3F5F8">
<div style="max-width: 1320px; margin: 0 auto; padding: 120px 32px; display: flex; flex-direction: column; gap: 56px">
<div class="reveal" style="display: flex; justify-content: space-between; align-items: end; gap: 32px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 18px; max-width: 720px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #8A5A00">{{ t.progEy }}</span>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 88%; font-weight: 800; font-size: clamp(38px, 4.4vw, 62px); line-height: 1; letter-spacing: -0.02em; color: #0F2747">{{ t.progH }}</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 440px">
<p style="margin: 0; font-size: 17px; line-height: 1.65; color: #3B4A5C">{{ t.progP }}</p>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #8A5A00"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9 A6 6 0 1 1 6 14.2 M3 9 L1 6.5 M3 9 L5.6 7.4" fill="none" stroke="#8A5A00" stroke-width="1.8" stroke-linecap="round"></path></svg>{{ t.hoverHint }}</span>
</div>
</div>
<div class="reveal" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 28px">
<sc-for list="{{ programs }}" as="p" hint-placeholder-count="4">
<article class="flip" tabindex="0" aria-label="{{ p.title }}">

      submit: function (e) { if (e && e.preventDefault) { e.preventDefault(); } self.setState({ submitted: true }); },
      reset: function () { self.setState({ submitted: false }); }
    };
  }
}
</script>
<script>
(function () {
  var tpl = document.getElementById('page-template');
  var mount = document.getElementById('app');
  var comp = new Component({});
  var pending = false;
  window.scheduleRender = function () { if (!pending) { pending = true; requestAnimationFrame(function () { pending = false; render(); }); } };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function lookup(scope, path) {
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'); var v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scope) { return str.replace(HOLE, function (_, p) { var v = lookup(scope, p); return v == null ? '' : String(v); }); }
  function child(scope, extra) { var s = Object.create(scope); for (var k in extra) s[k] = extra[k]; return s; }
  function build(node, scope, parent) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      var list = lookup(scope, (node.getAttribute('list').match(WHOLE) || [])[1]) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) { var ex = {}; ex[as] = item; ex.$index = i; var s = child(scope, ex);
        node.childNodes.forEach(function (c) { build(c, s, parent); }); });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup(scope, (node.getAttribute('value').match(WHOLE) || [])[1]);
      if (val) node.childNodes.forEach(function (c) { build(c, scope, parent); });
      return;
    }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(el.attributes).forEach(function (a) {
      var name = a.name, v = a.value;
      if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
      var m = v.match(WHOLE);
      if (name.length > 2 && name.indexOf('on') === 0 && m) {
        el.removeAttribute(name); var fn = lookup(scope, m[1]);
        if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
        return;
      }
      if (v.indexOf('{{') !== -1) el.setAttribute(name, interp(v, scope));
    });
    var kids = node.content ? node.content.childNodes : node.childNodes;
    kids.forEach(function (c) { build(c, scope, el); });
    parent.appendChild(el);
  }
  function render() {
    var vals = comp.renderVals();
    var frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach(function (c) { build(c, vals, frag); });
    mount.replaceChildren(frag);
    document.documentElement.lang = comp.state.lang || 'en';
  }
  render();
})();
</script>
